<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PaperAgent 科研工作空间</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><h1>PaperAgent</h1><p>云端个人科研助手 · 本地科研工作空间</p></header>
<section id="login"><h2>登录或注册</h2><label>云端服务地址<input id="api" value="http://127.0.0.1:8765"></label><label>用户名<input id="username" autocomplete="username" placeholder="至少 3 位字母、数字或 _ . -"></label><label>密码<input id="password" type="password" autocomplete="current-password" placeholder="至少 10 位"></label><div class="actions"><button id="signIn">登录</button><button id="register" class="secondary">注册</button></div></section>
<section id="workspace" hidden><div class="top"><div><h2>我的研究</h2><p>对话内容会发送到云端模型，请勿输入不愿发送的材料。</p></div><button id="logout" class="secondary">退出</button></div><div class="columns"><aside><form id="newSpace"><input id="spaceName" placeholder="新研究空间名称" required maxlength="100"><button>创建</button></form><div id="spaces"></div><h3>本地资料</h3><p>选择文件后可在任务中预览；未经确认不会发送。</p><input id="files" type="file" accept=".pdf,.docx,.txt,.md"><ul id="fileList"></ul></aside><article><h3 id="title">选择研究空间</h3><div id="messages" aria-live="polite"></div><form id="messageForm"><textarea id="text" placeholder="向科研助手提问" maxlength="12000" required></textarea><button id="send" disabled>发送</button></form><section><h3>本地资料分析</h3><p>选择文件并预览提取内容，确认后才会发送到云端及当前模型服务。</p><textarea id="taskGoal" placeholder="例如：分析这份资料的研究方法"></textarea><button id="previewMaterial" type="button">预览材料</button><pre id="materialPreview"></pre><button id="runTask" type="button" disabled>确认发送并执行</button><p id="taskProgress" role="status"></p></section></article></div></section><p id="status" role="status"></p></main><script src="app.js"></script></body></html>

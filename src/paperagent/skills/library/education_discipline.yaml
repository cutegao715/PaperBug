principles:
  - Align learning theory, intervention, measurement, classroom context, and learner outcomes.
procedure:
  - Define learner group, instructional context, intervention, measurement instrument, and comparison.
  - Track validity of scales, classroom observation protocols, and qualitative coding.
  - Interpret outcomes with attention to context and implementation fidelity.
heuristics:
  - Educational interventions need both design rationale and implementation evidence.
  - Student outcome claims should identify measurement timing and instrument limits.
quality_requirements:
  - intervention_fidelity
  - measurement_validity

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperagent-cloud"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["paperagent==0.1.0", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.5", "requests>=2.31", "PyYAML>=6.0"]

[project.scripts]
paperagent-cloud = "paperagent_cloud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperagent"
version = "0.1.0"
description = "Research Writing Agent - V2-m1 research copilot"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "requests>=2.31",
    "keyring>=25.0",
    "pypdf>=4.0",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-docx>=1.1",
    "python-pptx>=1.0.2",
]

[project.optional-dependencies]
mcp = ["mcp>=2.1,<3", "jsonschema>=4.23"]
dev = ["pytest>=8.0"]

[project.scripts]
paperagent = "paperagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperagent = ["product.json", "workflows/*.yaml", "skills/*.json", "skills/*.yaml", "skills/library/*.yaml", "skills/library/references/research/*.md", "skills/library/references/research/*.txt", "skills/library/references/general/*.md", "skills/library/references/general/*.txt", "skills/library/references/domain/*.md", "skills/library/references/domain/*.txt", "skills/library/references/english/*.md", "skills/library/references/english/*.txt", "skills/library/references/review/*.md", "skills/library/references/review/*.txt", "web/*.html", "web/*.js", "web/v6/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: opt-in real HTTP source checks"]
